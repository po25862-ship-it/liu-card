<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>傳送劉昭佑的電子名片</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--or:#e8601c;--ink:#1f1b18;--mute:#6b625b;--line:#e7e1dc}
*{box-sizing:border-box}
body{margin:0;background:#f6f4f2;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:420px;margin:0 auto;padding:28px 18px 40px}
h1{margin:0;font-size:24px;font-weight:900}
.sub{margin:6px 0 18px;color:var(--mute);font-size:15px}
/* preview of the LINE card */
.pv{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(60,25,5,.35)}
.pv .hd{background:var(--or);color:#fff;display:flex;gap:14px;padding:18px;align-items:center}
.pv .hd img{width:72px;height:92px;object-fit:cover;border-radius:10px;background:#fff;flex:none}
.pv .hd small{display:block;font-size:12px;opacity:.95}
.pv .hd b{display:block;font-size:26px;line-height:1.2;font-weight:900}
.pv .hd span{font-size:14px}
.pv .bd{padding:16px 18px 6px}
.pv .bd h2{margin:0;font-size:18px}
.pv .bd p{margin:4px 0 10px;color:var(--mute);font-size:14px}
.pv .kv{display:grid;grid-template-columns:3em 1fr;gap:4px 8px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.pv .kv dt{color:var(--mute)}.pv .kv dd{margin:0;font-weight:600}
.pv .ft{padding:12px 18px 16px;display:grid;gap:8px}
.pv .b{display:block;text-align:center;border-radius:8px;padding:9px;font-weight:700;font-size:14px;color:#fff;background:var(--or)}
.pv .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv .b.ln{background:#06c755}.pv .b.gr{background:#eceae8;color:var(--ink)}.pv .b.lk{background:none;color:var(--or)}
#send{display:block;width:100%;margin-top:22px;border:0;border-radius:14px;background:#06c755;color:#fff;font:inherit;font-size:18px;font-weight:800;min-height:56px;cursor:pointer}
#send:disabled{opacity:.5}
#status{text-align:center;color:var(--mute);font-size:14px;min-height:1.5em;margin:12px 0 0}
</style>
</head>
<body>
<main>
  <h1>傳送我的電子名片</h1>
  <p class="sub">選好友或群組，對方會收到這張可以直接撥號、加 LINE 的名片。</p>

  <div class="pv" aria-label="名片預覽">
    <div class="hd">
      <img src="photo.jpg" alt="">
      <div><small>台灣房屋｜捷運樂善直營店</small><b>劉昭佑</b><span>業務經理</span></div>
    </div>
    <div class="bd">
      <h2>林口龜山當鄰居</h2>
      <p>林口・龜山・A7 重劃區，買房、賣房、租屋、估價都可以找我聊。</p>
      <dl class="kv"><dt>手機</dt><dd>0938-888-906</dd><dt>店面</dt><dd>(03)328-8283</dd><dt>地址</dt><dd>桃園市龜山區樂善二路223號</dd></dl>
    </div>
    <div class="ft">
      <span class="b">撥打電話</span>
      <div class="row"><span class="b ln">加我 LINE</span><span class="b gr">看電子名片</span></div>
      <span class="b lk">轉傳這張名片</span>
    </div>
  </div>

  <button id="send" type="button" disabled>選擇好友傳送</button>
  <p id="status">載入中…</p>
</main>

<script>
{
/* ===== 只要改這一行：填入 LINE Developers 給你的 LIFF ID ===== */
const LIFF_ID = '2012780480-ZJcgVWjo';
/* ============================================================== */

const BASE = new URL('./', location.origin + location.pathname).href;
const PHOTO = BASE + 'photo.jpg';
const CARD_URL = BASE + 'card.html';
const LINE_URL = 'https://line.me/ti/p/cUeRQgiigK';
const FORWARD_URL = 'https://liff.line.me/' + LIFF_ID;

const btn = document.getElementById('send');
const st = document.getElementById('status');
const say = t => { st.textContent = t; };

const kv = (k, v) => ({
  type: 'box', layout: 'baseline', spacing: 'sm', contents: [
    { type: 'text', text: k, size: 'sm', color: '#8A817A', flex: 2 },
    { type: 'text', text: v, size: 'sm', color: '#1F1B18', weight: 'bold', flex: 7, wrap: true }
  ]
});

const card = () => ({
  type: 'flex',
  altText: '劉昭佑｜台灣房屋 捷運樂善直營店 電子名片',
  contents: {
    type: 'bubble',
    size: 'mega',
    body: {
      type: 'box', layout: 'vertical', paddingAll: '0px', contents: [
        {
          type: 'box', layout: 'horizontal', backgroundColor: '#E8601C', paddingAll: '18px', spacing: 'lg', contents: [
            {
              type: 'box', layout: 'vertical', width: '72px', height: '92px', cornerRadius: '10px', flex: 0, backgroundColor: '#FFFFFF',
              contents: [{ type: 'image', url: PHOTO, size: 'full', aspectMode: 'cover', aspectRatio: '72:92' }]
            },
            {
              type: 'box', layout: 'vertical', justifyContent: 'center', contents: [
                { type: 'text', text: '台灣房屋｜捷運樂善直營店', size: 'xxs', color: '#FFFFFF', wrap: true },
                { type: 'text', text: '劉昭佑', size: 'xxl', weight: 'bold', color: '#FFFFFF', margin: 'sm' },
                { type: 'text', text: '業務經理', size: 'sm', color: '#FFFFFF' }
              ]
            }
          ]
        },
        {
          type: 'box', layout: 'vertical', paddingAll: '18px', spacing: 'sm', contents: [
            { type: 'text', text: '林口龜山當鄰居', size: 'lg', weight: 'bold', color: '#1F1B18' },
            { type: 'text', text: '林口・龜山・A7 重劃區，買房、賣房、租屋、估價都可以找我聊。', size: 'sm', color: '#6B625B', wrap: true },
            { type: 'separator', margin: 'md', color: '#EEEAE6' },
            { type: 'box', layout: 'vertical', spacing: 'xs', margin: 'md', contents: [
              kv('手機', '0938-888-906'), kv('店面', '(03)328-8283'), kv('地址', '桃園市龜山區樂善二路223號')
            ]}
          ]
        }
      ]
    },
    footer: {
      type: 'box', layout: 'vertical', spacing: 'sm', paddingAll: '16px', paddingTop: '0px', contents: [
        { type: 'button', style: 'primary', color: '#E8601C', height: 'sm', action: { type: 'uri', label: '撥打電話', uri: 'tel:0938888906' } },
        { type: 'box', layout: 'horizontal', spacing: 'sm', contents: [
          { type: 'button', style: 'primary', color: '#06C755', height: 'sm', action: { type: 'uri', label: '加我 LINE', uri: LINE_URL } },
          { type: 'button', style: 'secondary', height: 'sm', action: { type: 'uri', label: '看電子名片', uri: CARD_URL } }
        ]},
        { type: 'button', style: 'link', color: '#E8601C', height: 'sm', action: { type: 'uri', label: '轉傳這張名片', uri: FORWARD_URL } }
      ]
    }
  }
});

const share = async () => {
  try {
    const res = await liff.shareTargetPicker([card()], { isMultiple: true });
    if (res) {
      say('已送出！');
      if (liff.isInClient()) setTimeout(() => liff.closeWindow(), 1200);
    } else {
      say('已取消，可以再按一次按鈕。');
    }
  } catch (e) {
    say('傳送失敗：' + (e.message || e.code || e));
  }
};

btn.addEventListener('click', share);

if (!LIFF_ID || LIFF_ID.startsWith('請填入')) {
  say('還沒設定 LIFF ID，請先改 index.html 裡的 LIFF_ID。');
} else {
  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    if (!liff.isApiAvailable('shareTargetPicker')) {
      say('這裡不能傳送，請用手機 LINE 打開這個連結。');
      return;
    }
    btn.disabled = false;
    say('');
    if (liff.isInClient()) share();
  }).catch(e => say('LIFF 初始化失敗：' + (e.message || e)));
}
}
</script>
</body>
</html>
